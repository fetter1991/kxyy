<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品 - 开心元元的个人粉丝站</title>
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 页面loading遮罩 -->
    <div class="page-loading show" id="pageLoading">
        <div class="loading-screen-effect"></div>
        <img src="../img/loading.gif" alt="loading" class="loading-gif">
        <div class="loading-typewriter">
            <div class="loading-line loading-line-cn" id="loadingLineCn"></div>
            <div class="loading-line loading-line-en" id="loadingLineEn"></div>
        </div>
    </div>
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <div class="nav-logo">
                <a href="index.html"><span class="logo-text"><img src="../img/logo.png" alt="开心元元"></span></a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="gallery.html" class="nav-link">相册</a></li>
                <li><a href="profile.html" class="nav-link">个人资料</a></li>
                <li><a href="music.html" class="nav-link">视频</a></li>
                <li><a href="growth.html" class="nav-link">成长历程</a></li>
                <li><a href="works.html" class="nav-link active">作品</a></li>
                <li><a href="message.html" class="nav-link">留言</a></li>
            </ul>
            <div class="nav-controls">
                <button class="nav-music-btn" id="navMusicBtn" title="播放音乐" aria-label="播放音乐">
                    <i class="fas fa-music"></i>
                </button>
                <button class="nav-toggle" id="navToggle" aria-label="菜单">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div id="pageContainer">
        <section class="page page-works active">
            <div class="works-header">
                <h2 class="page-title">精选作品</h2>
                <p class="page-subtitle">每一个画面都是用心之作</p>
            </div>
            <div class="works-grid" id="worksGrid"></div>
        </section>
    </div>

    <!-- 作品合集弹窗 -->
    <div class="work-modal" id="workModal">
        <div class="work-modal-content">
            <div class="work-modal-header">
                <div class="work-modal-title" id="workModalTitle"></div>
                <button class="work-modal-close" id="workModalClose"><i class="fas fa-times"></i></button>
            </div>
            <div class="work-modal-body" id="workModalBody"></div>
        </div>
    </div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose"><i class="fas fa-times"></i></span>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev"><i class="fas fa-chevron-left"></i></button>
        <img src="" alt="" class="lightbox-img" id="lightboxImg">
        <button class="lightbox-nav lightbox-next" id="lightboxNext"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox-caption" id="lightboxCaption"></div>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <button class="back-to-top" id="backToTop" title="回到顶部" aria-label="回到顶部">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="../js/data.js"></script>
    <script src="../js/comment.js"></script>
    <script src="../js/loading.js"></script>
    <script src="../js/common-ui.js"></script>
    <script src="../js/nav-player.js"></script>
    <script src="../js/gallery.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/music.js"></script>
    <script src="../js/growth.js"></script>
    <script src="../js/works.js"></script>
    <script src="../js/message.js"></script>
    <script src="../js/feathers.js"></script>
    <script src="../js/nav-switch.js"></script>
</body>
</html>
