<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频 - 开心元元的个人粉丝站</title>
    <link rel="icon" type="image/x-icon" href="../assets/img/global/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 页面loading遮罩 -->
    <div class="page-loading show" id="pageLoading">
        <div class="loading-screen-effect"></div>
        <img src="../assets/img/global/loading.gif" alt="loading" class="loading-gif">
        <div class="loading-typewriter">
            <div class="loading-line loading-line-cn" id="loadingLineCn"></div>
            <div class="loading-line loading-line-en" id="loadingLineEn"></div>
        </div>
    </div>
    <nav class="navbar" id="navbar">
        <div class="nav-inner">
            <div class="nav-logo">
                <a href="index.html"><span class="logo-text"><img src="../assets/img/global/logo.png" alt="开心元元"></span></a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="gallery.html" class="nav-link">相册</a></li>
                <li><a href="profile.html" class="nav-link">个人资料</a></li>
                <li><a href="music.html" class="nav-link active">视频</a></li>
                <li><a href="growth.html" class="nav-link">成长历程</a></li>
                <li><a href="works.html" class="nav-link">作品</a></li>
                <li><a href="message.html" class="nav-link">留言</a></li>
            </ul>
            <div class="nav-controls">
                <button class="nav-music-btn" id="navMusicBtn" title="播放音乐" aria-label="播放音乐">
                    <i class="fas fa-music"></i>
                </button>
                <button class="nav-toggle" id="navToggle" aria-label="菜单">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </nav>

    <div id="pageContainer">
        <section class="page page-music active">
            <div class="music-header">
                <h2 class="page-title">视频合集</h2>
                <p class="page-subtitle">记录每一个精彩瞬间</p>
            </div>
            <div class="music-content">
                <div class="music-panel">
                    <div class="video-player-stage" id="videoContainer">
                        <div class="player-video-wrap" id="playerVideoWrap">
                            <video class="player-video" id="playerVideo" playsinline preload="metadata"></video>
                        </div>
                        <div class="player-info">
                            <div class="player-title" id="playerTitle">未在播放</div>
                            <div class="player-artist" id="playerArtist">开心元元</div>
                            <div class="player-progress">
                                <div class="progress-bar" id="progressBar"></div>
                            </div>
                            <div class="player-time">
                                <span id="currentTime">00:00</span>
                                <span id="totalTime">00:00</span>
                            </div>
                            <div class="player-controls">
                                <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                                <button class="ctrl-btn play-btn" id="playBtn"><i class="fas fa-play"></i></button>
                                <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                                <button class="ctrl-btn fullscreen-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="album-tab-bar" id="albumTabBar">
                        <button class="album-tab-arrow album-tab-prev" id="albumTabPrev" aria-label="上一组专辑" disabled><i class="fas fa-chevron-left"></i></button>
                        <div class="album-tab-scroll" id="albumTabScroll"></div>
                        <button class="album-tab-arrow album-tab-next" id="albumTabNext" aria-label="下一组专辑" disabled><i class="fas fa-chevron-right"></i></button>
                        <button class="album-tab-menu" id="albumTabMenu" aria-label="专辑筛选" title="专辑筛选"><i class="fas fa-bars"></i></button>
                    </div>
                    <div class="music-playlist" id="videoPlaylist"></div>
                </div>
            </div>
        </section>
    </div>

    <button class="back-to-top" id="backToTop" title="回到顶部" aria-label="回到顶部">
        <i class="fas fa-chevron-up"></i>
    </button>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/comment.js"></script>
    <script src="../assets/js/loading.js"></script>
    <script src="../assets/js/common-ui.js"></script>
    <script src="../assets/js/nav-player.js"></script>
    <script src="../assets/js/gallery.js"></script>
    <script src="../assets/js/profile.js"></script>
    <script src="../assets/js/music.js"></script>
    <script src="../assets/js/growth.js"></script>
    <script src="../assets/js/works.js"></script>
    <script src="../assets/js/message.js"></script>
    <script src="../assets/js/feathers.js"></script>
    <script src="../assets/js/nav-switch.js"></script>
</body>
</html>
